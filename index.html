<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
  </head>
  <body>
    <div
      class="grid min-h-screen grid-cols-1 grid-rows-[64px_1fr_64px] gap-0 lg:grid-cols-[240px_1fr_1fr]"
    >
      <div
        id="sidebar-backdrop"
        onclick="toggleSidebar()"
        class="fixed inset-0 z-40 hidden bg-black/50 transition-opacity lg:hidden"
      ></div>

      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-50 w-[240px] -translate-x-full bg-slate-900 text-white transition-transform duration-300 ease-in-out lg:static lg:col-start-1 lg:row-span-3 lg:row-start-1 lg:translate-x-0"
      >
        <div
          class="flex h-16 items-center justify-between border-b border-slate-800 px-4"
        >
          <span class="font-bold">Brand</span>
          <button
            onclick="toggleSidebar()"
            type="button"
            class="rounded p-1 hover:bg-slate-800 lg:hidden"
            aria-label="Close sidebar"
          >
            ✕
          </button>
        </div>
        <nav class="p-4">Sidebar Content</nav>
      </aside>

      <header
        class="row-start-1 flex items-center gap-4 border-b border-slate-200 bg-white px-4 lg:col-span-2 lg:col-start-2 lg:row-start-1"
      >
        <button
          onclick="toggleSidebar()"
          class="rounded-md p-2 text-slate-700 hover:bg-slate-100 lg:hidden"
          type="button"
          aria-label="Open sidebar"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
        <span>Header</span>
      </header>

      <main
        class="row-start-2 bg-slate-50 p-4 lg:col-span-2 lg:col-start-2 lg:row-start-2"
      >
        Main Content
      </main>

      <footer
        class="row-start-3 flex items-center border-t border-slate-200 bg-white px-4 lg:col-span-2 lg:col-start-2 lg:row-start-3"
      >
        Footer
      </footer>
    </div>

    <script>
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const backdrop = document.getElementById("sidebar-backdrop");

        sidebar.classList.toggle("-translate-x-full");
        backdrop.classList.toggle("hidden");
      }
    </script>
  </body>
</html>
